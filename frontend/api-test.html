<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
  <script src="https://unpkg.com/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body>
  <h1>API Test Page</h1>
  <button onclick="testTeachers()">Test /teachers/</button>
  <button onclick="testGantt()">Test /exams/teachers/gantt</button>
  <pre id="output"></pre>
  
  <script>
    const apiClient = axios.create({
      baseURL: '/api',
      timeout: 30000
    })
    
    apiClient.interceptors.response.use(
      response => response.data,
      error => Promise.reject(error)
    )
    
    async function testTeachers() {
      try {
        const res = await apiClient.get('/teachers/', { params: { size: 1000 } })
        document.getElementById('output').textContent = JSON.stringify(res, null, 2)
      } catch(e) {
        document.getElementById('output').textContent = 'Error: ' + e.message
      }
    }
    
    async function testGantt() {
      try {
        const res = await apiClient.get('/exams/teachers/gantt')
        document.getElementById('output').textContent = JSON.stringify(res, null, 2)
      } catch(e) {
        document.getElementById('output').textContent = 'Error: ' + e.message
      }
    }
  </script>
</body>
</html>
