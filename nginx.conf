# =============================================
# 考试排考系统 - Nginx 反向代理配置
# =============================================

server {
    # 监听80端口（HTTP）
    listen 80;
    server_name localhost;

    # 字符编码
    charset utf-8;

    # Gzip压缩（提升传输效率）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 请求体大小限制（上传CSV文件需要较大的限制）
    client_max_body_size 50M;
    client_body_buffer_size 16K;

    # 代理超时配置（排考请求可能耗时较长）
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # =========================================
    # API 反向代理 - 所有 /api/ 请求转发到后端
    # =========================================
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;

        # SSE 流式响应必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;

        # 请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket支持（如需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================
    # 静态文件服务 - 直接由Nginx提供（高效）
    # =========================================
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";

        # 静态文件类型映射
        location ~* \.css$ {
            add_header Content-Type text/css;
        }
        location ~* \.js$ {
            add_header Content-Type application/javascript;
        }
        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================
    # 根路径 - 返回前端首页
    # =========================================
    location = / {
        root /usr/share/nginx/html/static;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # =========================================
    # Swagger UI /docs 反向代理
    # =========================================
    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================
    # ReDoc /redoc 反向代理
    # =========================================
    location /redoc {
        proxy_pass http://api:8000/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================
    # OpenAPI JSON 反向代理
    # =========================================
    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================
    # 健康检查端点
    # =========================================
    location /health {
        proxy_pass http://api:8000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;  # 健康检查不记录访问日志
    }

    # =========================================
    # 错误页面
    # =========================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
